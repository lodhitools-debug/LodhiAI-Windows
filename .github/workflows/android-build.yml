name: Lodhi AI — Android Companion Build & CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build-android-companion:
    name: Build Native Android Companion APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: false

      - name: Auto-Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Run Android Companion Unit Tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK Integrity & Compute Checksums
        working-directory: android
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          cat app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lodhi-ai-android-companion-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Failure Diagnostics on Error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-logs
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
